<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        box-sizing: border-box;
    }
    body{
        margin: 0;
        background-color: darkblue;
        height: 100vh;
        width: 100vh;
    }
    .container {
        display: flex;
        flex-direction: row;
        height: calc(100vh -2em);
        width:100vw;
        gap : 3em;
        padding:0  3em;
    }
    .left{
        flex-grow: 1;
        background-color: green;
    }
    .right{
        display: flex;
        flex-direction: column;
        gap: 1em;
        padding: 1em;
        height: 100vh;
        width: 10cm;
        background-color: burlywood;
    }
    .item{
        flex: 1;
        height : 100px;
        background-color: aqua;
    }
</style>
<body >
    <div class="container">
        <div class="left">
        </div>
        <div class="right">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
    </div>
</body>
</html>
